services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brain_agriculture
      POSTGRES_PASSWORD: brain_agriculture
      POSTGRES_DB: brain_agriculture
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brain_agriculture -d brain_agriculture']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: development
    command: >-
      sh -c "node ace migration:run --force --no-schema-generate && npm run dev"
    environment:
      TZ: UTC
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: development
      APP_NAME: Brain Agriculture API
      LOG_LEVEL: info
      APP_KEY: local-development-key-change-in-production
      APP_URL: http://localhost:3333
      SESSION_DRIVER: cookie
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: brain_agriculture
      DB_PASSWORD: brain_agriculture
      DB_DATABASE: brain_agriculture
    ports:
      - '3333:3333'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3333/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    init: true

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://api:3333
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
